name: CI (with Spack)

# Build and test Basix using Spack, exercising the fenics-basix (C++) and
# py-fenics-basix (Python) Spack packages rather than the pip/CMake paths
# used elsewhere in CI.

on:
  pull_request:
    branches:
      - main
  merge_group:
    branches:
      - main
  workflow_dispatch:

jobs:
  ci-spack-build:
    name: ci-spack-build
    runs-on: ubuntu-24.04
    container: ubuntu:24.04
    permissions:
      packages: write

    steps:
      - name: Branch and commit SHA
        run: |
          echo "Branch and commit SHA: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}, ${{ github.sha }}"

      - name: Install Spack requirements
        run: |
          apt-get -y update
          apt-get install -y bzip2 ca-certificates file g++ gcc gfortran git gzip \
            lsb-release patch pkg-config python3 tar unzip xz-utils zstd

      - name: Set up Spack
        uses: spack/setup-spack@16b756799ede8b28951287f89bcd3fdb32ec1ca3 # v3.0.0
        with:
          spack_ref: v1.2.2
          packages_ref: d342cee94fb90fb020776c8bd8500b54a19c63cf

      - name: Get FEniCS Spack packages
        uses: actions/checkout@v7
        with:
          repository: fenics/spack-fenics
          ref: main
          path: spack-fenics

      # Add FEniCS Spack packages on top of the upstream Spack packages
      - name: Add FEniCS Spack packages repo
        run: |
          spack repo add --name fenics $GITHUB_WORKSPACE/spack-fenics/spack_repo/fenics

      - name: Get Basix code
        uses: actions/checkout@v7
        with:
          path: basix-src

      - name: Load dev branch environment variables
        run: cat basix-src/.github/workflows/fenicsx-refs.env >> $GITHUB_ENV

      - name: Get UFL code
        uses: actions/checkout@v7
        with:
          repository: ${{ env.ufl_repository }}
          ref: ${{ env.ufl_ref }}
          path: ufl-src

      - name: Record source commit SHAs
        run: |
          echo "BASIX_SHA=$(git -C $GITHUB_WORKSPACE/basix-src rev-parse HEAD)" >> $GITHUB_ENV
          echo "UFL_SHA=$(git -C $GITHUB_WORKSPACE/ufl-src rev-parse HEAD)" >> $GITHUB_ENV

      - name: Prepare Spack environment
        run: |
          spack env create ci
          spack -e ci develop --no-clone --path $GITHUB_WORKSPACE/basix-src fenics-basix@main
          spack -e ci develop --no-clone --path $GITHUB_WORKSPACE/basix-src py-fenics-basix@main
          spack -e ci develop --no-clone --path $GITHUB_WORKSPACE/ufl-src py-fenics-ufl@main

      - name: Build Basix and test dependencies
        run: |
          # Ensure build provenance by adding manually and providing git sha
          spack -e ci add fenics-basix@main commit=$BASIX_SHA build_type=Developer
          spack -e ci add py-fenics-basix@main commit=$BASIX_SHA +ufl
          spack -e ci add py-fenics-ufl@main commit=$UFL_SHA
          spack -e ci add py-matplotlib py-numba py-pytest py-pytest-xdist py-scipy py-sympy cmake ninja
          spack -e ci concretize -j 4
          spack -e ci install -j 4 --use-buildcache auto

      # Pushed before the test steps so the artifacts are cached even if a
      # later step fails. The index is rebuilt by the final push.
      - name: Push packages to cache
        run: |
          spack -e ci buildcache push --base-image ubuntu:24.04 --only dependencies \
            --with-build-dependencies --allow-missing local-buildcache
        if: ${{ !cancelled() }}

      - name: Run C++ demos
        shell: spack-bash {0}
        run: |
          spack env activate ci
          spack load cmake ninja py-fenics-basix
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Debug -B build/demo -S basix-src/demo/cpp/demo_create_and_tabulate
          cmake --build build/demo
          build/demo/demo_create_and_tabulate

      - name: Run CMake integration test
        shell: spack-bash {0}
        run: |
          spack env activate ci
          spack load cmake ninja py-fenics-basix
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Debug -B build/test-cmake -S basix-src/test/test_cmake
          cmake --build build/test-cmake
          build/test-cmake/a.out

      - name: Run pkg-config integration test
        shell: spack-bash {0}
        run: |
          spack env activate ci
          spack load fenics-basix
          cd basix-src/test/test_pkgconfig
          make run

      - name: Run Python unit tests
        shell: spack-bash {0}
        run: |
          spack env activate ci
          spack load gcc py-fenics-basix
          python3 -m pytest -n auto --durations 20 basix-src/test/

      - name: Run Python demos
        shell: spack-bash {0}
        run: |
          spack env activate ci
          spack load gcc py-fenics-basix
          python3 -m pytest basix-src/demo/python/test.py

      # The test tools are environment roots, so '--only dependencies'
      # skips them and they need naming explicitly. Only the final push
      # rebuilds the index, which is the expensive part.
      - name: Push test packages to cache and update index
        run: |
          spack -e ci buildcache push --base-image ubuntu:24.04 --allow-missing --update-index local-buildcache \
            py-matplotlib py-numba py-pytest py-pytest-xdist py-scipy py-sympy cmake ninja
        if: ${{ !cancelled() }}
