name: clang-tidy

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  merge_group:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  clang-tidy:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install clang-tidy ninja-build libopenblas-dev liblapack-dev
          pip install nanobind scikit-build-core[pyproject]
      - name: Run clang-tidy (C++)
        working-directory: cpp
        run: |
          cmake -G Ninja -B build -DENABLE_CLANG_TIDY=ON .
          cmake --build build/
          sudo cmake --install build/
      - name: Run clang-tidy (Python)
        working-directory: python
        run: pip install --no-build-isolation --verbose --config-settings=cmake.define.ENABLE_CLANG_TIDY=ON .
