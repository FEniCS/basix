name: DOLFINx integration

# This workflow will install Basix, FFCx, DOLFINx and run the DOLFINx
# unit tests.

on:
  push:
  pull_request:
    branches:
      - main
  merge_group:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Run DOLFINx tests
    runs-on: ubuntu-24.04
    container: ghcr.io/fenics/test-env:current-openmpi

    env:
      PETSC_ARCH: linux-gnu-complex64-32
      OMPI_ALLOW_RUN_AS_ROOT: 1
      OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: 1
      PRTE_MCA_rmaps_default_mapping_policy: :oversubscribe   # Newer OpenMPI
      OMPI_MCA_rmaps_base_oversubscribe: true                 # Older OpenMPI

    steps:
      - uses: actions/checkout@v7
      - name: Load environment variables
        run: cat .github/workflows/fenicsx-refs.env >> $GITHUB_ENV
      - name: Install Basix
        run: |
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Developer -B build-dir -S cpp/
          cmake --build build-dir/
          cmake --install build-dir/
          # This tests non-RPATH based linking.
          ldconfig
          python3 -m pip -v install -Ccmake.args=-DBASIX_SET_INSTALL_RPATH=OFF --break-system-packages python/
      - name: Install FEniCS Python components
        run: |
          python3 -m pip install --break-system-packages git+https://github.com/${{ env.ufl_repository }}.git@${{ env.ufl_ref }}
          python3 -m pip install --break-system-packages git+https://github.com/${{ env.ffcx_repository }}.git@${{ env.ffcx_ref }}
      - name: Get DOLFINx
        uses: actions/checkout@v7
        with:
          path: ./dolfinx
          repository: ${{ env.dolfinx_repository }}
          ref: ${{ env.dolfinx_ref }}
      - name: Install DOLFINx (C++)
        run: |
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Developer -DBUILD_TESTING=true -B build -S dolfinx/cpp/
          cmake --build build
          cmake --install build
      - name: Run DOLFINx C++ unit tests
        working-directory: build
        run: ctest -V --output-on-failure -R unittests
      - name: Install DOLFINx (Python)
        run: |
          python3 -m pip install scikit-build-core
          python3 -m scikit_build_core.build requires | python3 -c "import sys, json; print(' '.join(json.load(sys.stdin)))" | xargs pip install
          python3 -m pip -v install --break-system-packages --check-build-dependencies --no-build-isolation 'dolfinx/python/[mypy,test]'
      - name: Run mypy checks
        run: |
          mypy --config-file python/pyproject.toml -p dolfinx --exclude superlu_dist.py
          cd python/
          mypy test
        # mypy demo
      - name: Install Python demo/test dependencies
        run: python3 -m pip install --break-system-packages matplotlib numba pyamg pytest pytest-xdist scipy pyvista networkx
      - name: Run DOLFINx Python unit tests
        working-directory: dolfinx
        run: python3 -m pytest -n auto python/test/unit
      - name: Run DOLFINx Python demos
        working-directory: dolfinx
        run: python3 -m pytest -n auto -m serial --durations=10 python/demo/test.py
