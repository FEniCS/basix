name: Platform builds

# This workflow builds and tests Basix on additional platforms/toolchains
# not covered by the main CI: Intel oneAPI compilers/MKL, NVIDIA HPC SDK
# (nvc++), Red Hat, and macOS.

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  merge_group:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  oneapi:
    name: Build and test (oneAPI)
    runs-on: ubuntu-26.04
    container: ubuntu:26.04  # Run in container to test with minimal pre-installed packages
    env:
      CC: icx
      CXX: icpx
      DEBIAN_FRONTEND: noninteractive
      CMAKE_GENERATOR: Ninja
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - name: Install compiler dependencies
        run: |
          apt-get -y update
          apt-get -y install binutils libstdc++-14-dev

      - uses: actions/checkout@v7

      - uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4
        with:
          activate-environment: oneapi
          python-version: 3.13
          channels: https://software.repos.intel.com/python/conda,conda-forge

      - name: Install
        run: >
          conda config --set plugins.conda_pypi_pip_warning false &&
          conda install python=3.13 dpcpp_linux-64 cmake git libblas=*=*mkl
          matplotlib nanobind ninja numba numpy pip pytest pytest-xdist
          scikit-build-core scipy sympy

      - name: Install Basix
        run: |
          pip -v install --no-build-isolation -Ccmake.build-type="Developer" .
      - name: Run tests
        run: |
          pip -v install git+https://github.com/FEniCS/ufl.git
          pytest -n auto --durations 20 test/
          pytest demo/python/test.py
          pytest demo/cpp/test.py

  nvhpc:
    name: Build and test (NVIDIA HPC SDK)
    runs-on: ubuntu-26.04
    container: nvcr.io/nvidia/nvhpc:26.9-devel-cuda13.3-ubuntu24.04
    env:
      CC: nvc
      CXX: nvc++
      CMAKE_GENERATOR: Ninja
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install dependencies
        run: |
          apt-get -y update
          apt-get -y install catch2 git libopenblas-dev liblapack-dev ninja-build python3-dev python3-venv
      - uses: actions/checkout@v7
      - name: Set up Python environment
        run: |
          python3 -m venv /opt/venv
          /opt/venv/bin/pip install --upgrade pip
          echo "/opt/venv/bin" >> "$GITHUB_PATH"
      - name: Load environment variables
        run: cat .github/workflows/fenicsx-refs.env >> "$GITHUB_ENV"
      - name: Install Basix (C++)
        run: |
          cmake -DCMAKE_BUILD_TYPE=Developer -B build-dir -S cpp
          cmake --build build-dir
          cmake --install build-dir
      - name: Run C++ unit tests
        run: |
          cmake -DCMAKE_BUILD_TYPE=Developer -B build-dir-test -S cpp/test
          cmake --build build-dir-test
          ctest --test-dir build-dir-test --output-on-failure
      - name: Install UFL
        run: pip install git+https://github.com/${{ env.ufl_repository }}.git@${{ env.ufl_ref }}
      # nanobind rejects nvc++ (it cannot identify the C++ ABI), so build
      # the extension with gcc against the nvc++-built library; both use
      # the system libstdc++
      - name: Install Basix (Python)
        env:
          CC: gcc
          CXX: g++
        run: |
          cd python
          pip install --group build
          pip -v install --no-build-isolation -Ccmake.build-type="Developer" --group test .
      - name: Run tests
        run: |
          pip install pytest-xdist
          pytest -n auto --durations 20 test/
          pytest demo/python/test.py
          pytest demo/cpp/test.py

  redhat:
    name: Build and test (Red Hat)
    runs-on: ubuntu-26.04
    container: rockylinux/rockylinux:10
    env:
      CC: gcc
      CXX: g++
    steps:
      - name: Install dependencies
        run: |
          dnf -y update
          dnf install -y dnf-plugins-core
          dnf config-manager --set-enabled crb
          dnf install -y openblas-devel cmake gcc gcc-c++ git lapack-devel python3 python3-devel python3-pip
      - name: Upgrade pip
        run: python3 -m pip install pip --upgrade
      - uses: actions/checkout@v7
      - name: Load environment variables
        run: cat .github/workflows/fenicsx-refs.env >> "$GITHUB_ENV"
      - name: Install UFL
        run: python3 -m pip -v install git+https://github.com/${{ env.ufl_repository }}.git@${{ env.ufl_ref }}
      - name: Install Basix
        run: python3 -m pip install -Ccmake.build-type="Developer" --group test .
      - name: Run tests
        run: |
          python3 -m pytest --durations 20 test/
          python3 -m pytest demo/python/test.py
          python3 -m pytest demo/cpp/test.py

  macos:
    name: Build and test (MacOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install dependencies (non-Python)
        run: brew install ninja
      - name: Load environment variables
        run: cat .github/workflows/fenicsx-refs.env >> "$GITHUB_ENV"
      - name: Install UFL
        run: pip -v install git+https://github.com/${{ env.ufl_repository }}.git@${{ env.ufl_ref }}
      - name: Install Basix
        run: pip -v install -Ccmake.build-type="Developer" --group test .
      - name: Run tests
        run: |
          pip install --only-binary :all: pytest-xdist
          pytest -n auto --durations 20 test/
          pytest demo/python/test.py
          pytest demo/cpp/test.py
