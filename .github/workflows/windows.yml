name: Basix CI on Windows

on:
   pull_request:
     branches:
       - main
   push:
     tags:
       - "v*"
   merge_group:
     branches:
       - main
   workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-combined:
    name: Combined build and test
    runs-on: windows-2022
    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg-cache,readwrite"

    steps:
      - uses: actions/checkout@v7

      - name: Cache vcpkg binaries
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: vcpkg-combined-${{ hashFiles('**/vcpkg.json') }}
          restore-keys: vcpkg-combined-

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "latest"

      - name: Load environment variables
        shell: bash
        run: cat .github/workflows/fenicsx-refs.env >> "$GITHUB_ENV"

      - name: Install UFL
        shell: bash
        run: python -m pip -v install git+https://github.com/${{ env.ufl_repository }}.git@${{ env.ufl_ref }}

      - name: Install Basix (combined)
        run: |
          python -m pip -v install --no-cache-dir --group ci . --config-settings=cmake.args=-DINSTALL_RUNTIME_DEPENDENCIES=ON --config-settings=cmake.args=-DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake

      - name: Run units tests
        run: |
          python -m pytest -n auto --durations 20 test/
      # C++ development is not supported against combined install on Windows
      - name: Run python demos
        run: python -m pytest demo/python/test.py

  build-split:
    name: Split build and test
    runs-on: windows-2022
    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg-cache,readwrite"
    steps:
      - uses: actions/checkout@v7

      - name: Cache vcpkg binaries
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: vcpkg-split-${{ hashFiles('**/vcpkg.json') }}
          restore-keys: vcpkg-split-

      - name: Insert add_dll_directory calls
        working-directory: python/basix
        run: |
          (Get-Content __init__.py).Replace('# WINDOWSDLL', 'import os; os.add_dll_directory("D:/a/basix/install/bin")') | Set-Content __init__.py
          Get-Content __init__.py

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "latest"

      - name: Install Basix (C++)
        run: |
          cd cpp
          cmake -DINSTALL_RUNTIME_DEPENDENCIES=ON -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -B build-dir -S .
          cmake --build build-dir --config Release
          cmake --install build-dir --config Release --prefix D:/a/basix/install
          echo "D:/a/basix/install/bin" | Out-File -Append -FilePath $env:GITHUB_PATH -Encoding utf8

      - name: Run C++ unit tests
        run: |
          cmake -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -DBasix_DIR=D:/a/basix/install/lib/cmake/basix -B build-dir-test -S cpp/test
          cmake --build build-dir-test --config Release
          ctest --test-dir build-dir-test -C Release --output-on-failure

      - name: Load environment variables
        shell: bash
        run: cat .github/workflows/fenicsx-refs.env >> "$GITHUB_ENV"

      - name: Install UFL
        shell: bash
        run: python -m pip -v install git+https://github.com/${{ env.ufl_repository }}.git@${{ env.ufl_ref }}

      - name: Install Basix (Python)
        run: |
          cd python
          python -m pip -v install --no-cache-dir --group ci . --config-settings=cmake.args=-DBasix_DIR=D:/a/basix/install/lib/cmake/basix
          cd ../

      - name: Run units tests
        run: |
          python -m pytest -n auto --durations 20 test/
      - name: Run C++ demos
        run: python -m pytest demo/cpp/test.py --cmake-args="-DBasix_DIR=D:/a/basix/install/lib/cmake/basix"
