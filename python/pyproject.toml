[build-system]
requires = ["scikit-build-core[pyproject]>=0.11.2", "nanobind>=2.5.0"]
build-backend = "scikit_build_core.build"

[project]
name = "fenics-basix"
version = "0.12.0.dev0"
description = "Basix Python interface"
readme = "../README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { email = "fenics-steering-council@googlegroups.com" },
    { name = "FEniCS Steering Council" },
]
# Allows split mode to override.
dynamic = ["dependencies"]

[project.urls]
homepage = "https://fenicsproject.org"
repository = "https://github.com/fenics/basix.git"
documentation = "https://docs.fenicsproject.org"

[project.optional-dependencies]
# llvmlite (numba) is not built for x86_64 on macOS or arm64 on Windows.
optional = ["numba; (sys_platform != 'darwin' or platform_machine != 'x86_64') and (sys_platform != 'win32' or platform_machine != 'ARM64')", "fenics-ufl@git+https://github.com/fenics/ufl"]

[dependency-groups]
# Keep in sync with [build-system].requires above.
build = ["scikit-build-core[pyproject]>=0.11.2", "nanobind>=2.5.0"]
docs = ["markdown", "pylit3", "pyyaml", "sphinx", "pydata-sphinx-theme"]
lint = ["ruff", "gersemi"]
test = ["pytest", "sympy", "scipy", "matplotlib", "fenics-basix[optional]"]
ci = ["pyrefly", "pytest-xdist", { include-group = "docs" }, { include-group = "lint" }, { include-group = "test" }]

[tool.scikit-build]
wheel.packages = ["basix"]
wheel.exclude = ["*.cpp"]

[tool.scikit-build.cmake.define]
# Set to FALSE to disable all install RPATH adjustments
BASIX_SET_INSTALL_RPATH = "TRUE"

[tool.scikit-build.metadata.dependencies]
provider = "scikit_build_core.metadata.template"
result = ["numpy>=2"]

# Keep split-mode settings in sync with the repository-root pyproject.toml.
[[tool.scikit-build.overrides]]
if.env.BASIX_NANOBIND_SPLIT = true
inherit.cmake.define = "append"
cmake.define.BASIX_NANOBIND_SPLIT = "ON"
# Stub generation imports the extension, so the backend is also a build dependency.
build.requires = ["nanobind>=3", "nanobind-backend>=1.0"]
metadata.dependencies.provider = "scikit_build_core.metadata.template"
metadata.dependencies.result = ["numpy>=2", "nanobind-backend>=1.0"]
wheel.py-api = "cp311"
